name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Kirby ${{ matrix.kirby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        kirby: ['^5.0', '^6.0']
        exclude:
          # Kirby 5 does not support PHP 8.6
          - php: '8.6'
            kirby: '^5.0'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set Kirby version
        run: composer require "getkirby/cms:${{ matrix.kirby }}" --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Run tests
        run: composer test -- --ci
